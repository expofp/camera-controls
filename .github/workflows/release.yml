name: ExpoFP Release

# Tag-only dist release for the ExpoFP fork.
# On every push to `expofp`: build, then publish an immutable tag whose commit
# contains the built `dist/`. The `expofp` branch itself stays source-only —
# the release commit is pushed ONLY as a tag ref, never back to the branch.
# Consumers install a specific tag:  github:expofp/camera-controls#v3.1.3-expofp.1

on:
  push:
    branches: [expofp]

concurrency:
  group: expofp-release
  cancel-in-progress: false      # queue releases, never drop one

permissions:
  contents: write                # push tags + create GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint & build (RELEASE GATE — a broken merge produces no tag)
        run: |
          npm run lint
          npm run build

      - name: Compute next tag
        id: tag
        run: |
          # Base = nearest upstream release tag actually reachable from HEAD.
          # `--exclude '*-expofp*'` keeps our own release tags from matching the glob.
          git remote add upstream https://github.com/yomotsu/camera-controls.git 2>/dev/null || true
          git fetch upstream --tags -q
          git fetch --tags --force
          BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-expofp*' HEAD | sed 's/^v//') \
            || { echo "::error::no upstream base tag reachable from expofp"; exit 1; }
          N=$(git tag -l "v${BASE}-expofp.*" | sed "s/.*-expofp\.//" | sort -n | tail -1)
          N=${N:-0}
          TAG="v${BASE}-expofp.$((N + 1))"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Next release tag: $TAG"

      - name: Assemble dist-bearing release commit (lean consumer install)
        run: |
          git config user.name  "expofp-ci"
          git config user.email "ci@expofp.com"
          # Drop `prepare` so a git-dependency install neither rebuilds nor pulls devDeps —
          # it just consumes the committed dist/. This edit lives only on the tag.
          npm pkg delete scripts.prepare
          git add -f dist package.json
          git commit -m "chore(release): ${{ steps.tag.outputs.tag }} [skip ci]"

      - name: Tag & push (TAG ONLY — expofp stays source-only)
        run: |
          git tag -a "${{ steps.tag.outputs.tag }}" -m "ExpoFP release ${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --repo pins gh to the fork; without it gh resolves the default repo from git
        # remotes and picks `upstream` (yomotsu), which was added in the compute-tag step.
        run: gh release create "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --generate-notes --title "${{ steps.tag.outputs.tag }}"
